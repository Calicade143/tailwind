<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color</title>
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <h1>welcome to the color page</h1>
    <h1 class="text-green-50">Color Examples</h1>
    <h1 class="text-green-100">Color Examples</h1>
    <h1 class="text-green-200">Color Examples</h1>
    <h1 class="text-green-300">Color Examples</h1>
    <h1 class="text-green-400">Color Examples</h1>
    <!--background color examples-->
    <div class="bg-green-600">
    <p class="text-green">Background Color Example</p>
    </div>
    <!--border color examples-->
    <div class="border-4 border-green-700">
        <p class="text-green">Border Color Example</p>
    </div>
    <!--arbitary color-->
    <p class="bg-[#ff00ff]">custom</p>
    <!--opacity examples-->
    <div>
        <p class="bg-green-600/50">Semi-transparent background</p></div>
   
</body>
</html>
